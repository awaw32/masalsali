name: فحص الموقع

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: فحص صياغة الجافاسكربت
        run: node --check script.js
      - name: فحص جودة المشروع
        run: node tools/check.mjs